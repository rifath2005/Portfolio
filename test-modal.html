<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Contact Modal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; padding: 20px; }
    
    .test-btn {
      padding: 1rem 2rem;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
    }
    
    /* Contact Modal */
    .contact-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    
    .contact-modal.active {
      display: flex !important;
      opacity: 1 !important;
    }
    
    .contact-modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      cursor: pointer;
    }
    
    .contact-modal-content {
      position: relative;
      background: #ffffff;
      border-radius: 16px;
      padding: 3rem 2.5rem;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      transform: scale(0.9);
      transition: transform 0.3s ease;
      z-index: 1;
    }
    
    .contact-modal.active .contact-modal-content {
      transform: scale(1);
    }
    
    .contact-modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: transparent;
      border: none;
      font-size: 2.5rem;
      cursor: pointer;
      color: #666;
    }
    
    .contact-modal-title {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }
    
    .contact-modal-subtitle {
      color: #666;
      margin-bottom: 2rem;
    }
    
    .contact-modal-links {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    
    .contact-modal-link {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 1.2rem 1.5rem;
      background: #f8f8f8;
      border-radius: 12px;
      text-decoration: none;
      color: #000;
      transition: all 0.3s ease;
      border: 2px solid transparent;
    }
    
    .contact-modal-link:hover {
      background: #fff;
      border-color: #000;
      transform: translateX(10px);
    }
    
    .contact-modal-icon {
      font-size: 2rem;
    }
    
    .contact-modal-link-title {
      font-weight: 600;
      font-size: 1.1rem;
    }
    
    .contact-modal-link-subtitle {
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>Test Contact Modal</h1>
  <button class="test-btn" onclick="openModal()">Open Modal</button>
  
  <div class="contact-modal" id="contactModal">
    <div class="contact-modal-overlay" onclick="closeModal()"></div>
    <div class="contact-modal-content">
      <button class="contact-modal-close" onclick="closeModal()">&times;</button>
      <h2 class="contact-modal-title">Let's Connect</h2>
      <p class="contact-modal-subtitle">Choose your preferred way to reach out</p>
      
      <div class="contact-modal-links">
        <a href="mailto:test@example.com" class="contact-modal-link">
          <span class="contact-modal-icon">📧</span>
          <div>
            <div class="contact-modal-link-title">Email</div>
            <div class="contact-modal-link-subtitle">test@example.com</div>
          </div>
        </a>
        
        <a href="#" class="contact-modal-link">
          <span class="contact-modal-icon">💼</span>
          <div>
            <div class="contact-modal-link-title">LinkedIn</div>
            <div class="contact-modal-link-subtitle">Connect professionally</div>
          </div>
        </a>
      </div>
    </div>
  </div>
  
  <script>
    function openModal() {
      console.log('Opening modal');
      const modal = document.getElementById('contactModal');
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }
    
    function closeModal() {
      console.log('Closing modal');
      const modal = document.getElementById('contactModal');
      modal.classList.remove('active');
      document.body.style.overflow = '';
    }
    
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closeModal();
      }
    });
  </script>
</body>
</html>
